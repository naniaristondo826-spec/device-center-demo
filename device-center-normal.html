<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>融合设备中心 - 日常态</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: linear-gradient(180deg, #0a1628 0%, #0f2847 40%, #0a1e3d 100%);
    color: #fff;
    min-height: 100vh;
    max-width: 390px;
    margin: 0 auto;
    padding-bottom: 40px;
    overflow-x: hidden;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px 0;
    font-size: 15px;
    font-weight: 600;
  }
  .status-bar .time { font-size: 16px; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 12px;
  }
  .header .back { font-size: 24px; opacity: 0.8; cursor: pointer; }
  .header .title { font-size: 18px; font-weight: 600; }
  .header .more { font-size: 20px; opacity: 0.8; cursor: pointer; letter-spacing: 2px; }

  /* Section label */
  .section-label {
    padding: 16px 20px 10px;
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }

  /* Frequent devices */
  .frequent-devices {
    display: flex;
    gap: 20px;
    padding: 0 20px 8px;
  }
  .freq-device {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .freq-device .icon-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  .freq-device .name {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
  }

  /* Device cards grid */
  .device-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 20px;
  }
  .device-card {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    min-height: 100px;
  }
  .device-card .card-icon {
    font-size: 28px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .device-card .card-name {
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.9);
  }

  /* Home section */
  .home-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 24px 20px 12px;
  }
  .home-header .home-icon { font-size: 14px; }
  .home-header .home-name {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }
  .home-header .location-icon {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
  }

  /* Scene buttons */
  .scene-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 20px 12px;
  }
  .scene-btn {
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
  }
  .scene-btn .scene-icon { font-size: 22px; }
  .scene-btn .scene-name { font-size: 14px; font-weight: 500; }

  /* IoT device cards */
  .iot-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 20px;
  }
  .iot-card {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border: 1px solid rgba(255,255,255,0.06);
    position: relative;
  }
  .iot-card.active {
    background: rgba(255,255,255,0.12);
  }
  .iot-card .iot-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .iot-card .iot-icon { font-size: 28px; }
  .iot-card .iot-toggle {
    width: 36px;
    height: 22px;
    border-radius: 11px;
    background: rgba(255,255,255,0.15);
    position: relative;
    cursor: pointer;
  }
  .iot-card .iot-toggle.on {
    background: #34c759;
  }
  .iot-card .iot-toggle::after {
    content: '';
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    transition: transform 0.2s;
  }
  .iot-card .iot-toggle.on::after {
    transform: translateX(14px);
  }
  .iot-card .iot-name {
    font-size: 14px;
    font-weight: 500;
    margin-top: 8px;
  }
  .iot-card .iot-detail {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<!-- Status Bar -->
<div class="status-bar">
  <span class="time">2:36</span>
  <span class="icons">📶 WiFi 🔋100</span>
</div>

<!-- Header -->
<div class="header">
  <span class="back">←</span>
  <span class="title">融合设备中心</span>
  <span class="more">⋮</span>
</div>

<!-- 常用 -->
<div class="section-label">常用</div>
<div class="frequent-devices">
  <div class="freq-device">
    <div class="icon-circle">📺</div>
    <span class="name">小米电视</span>
  </div>
  <div class="freq-device">
    <div class="icon-circle">📱</div>
    <span class="name">Xiaomi Pad</span>
  </div>
</div>

<!-- 附近与个人设备 -->
<div class="section-label">附近与个人设备</div>
<div class="device-grid">
  <div class="device-card">
    <div class="card-icon">🎧</div>
    <div class="card-name">Xiaomi Buds 5</div>
  </div>
  <div class="device-card">
    <div class="card-icon">📱</div>
    <div class="card-name">Xiaomi Pad</div>
  </div>
  <div class="device-card">
    <div class="card-icon">💻</div>
    <div class="card-name">Xiaomi Book</div>
  </div>
  <div class="device-card">
    <div class="card-icon">📺</div>
    <div class="card-name">小米电视</div>
  </div>
</div>

<!-- 家 -->
<div class="home-header">
  <span class="home-name">乔纳斯的家</span>
  <span class="location-icon">◇</span>
</div>

<div class="scene-buttons">
  <div class="scene-btn">
    <span class="scene-icon">🏠</span>
    <span class="scene-name">回家</span>
  </div>
  <div class="scene-btn">
    <span class="scene-icon">🚪</span>
    <span class="scene-name">离家</span>
  </div>
</div>

<div class="iot-grid">
  <div class="iot-card active">
    <div class="iot-top">
      <span class="iot-icon">🛋️</span>
      <div class="iot-toggle on"></div>
    </div>
    <div class="iot-name">床头灯</div>
    <div class="iot-detail">卧室 50%</div>
  </div>
  <div class="iot-card">
    <div class="iot-top">
      <span class="iot-icon">❄️</span>
      <div class="iot-toggle"></div>
    </div>
    <div class="iot-name">空调</div>
    <div class="iot-detail">客厅</div>
  </div>
  <div class="iot-card">
    <div class="iot-top">
      <span class="iot-icon">💡</span>
      <div class="iot-toggle on"></div>
    </div>
    <div class="iot-name">客厅吸顶灯</div>
    <div class="iot-detail">客厅 80%</div>
  </div>
  <div class="iot-card">
    <div class="iot-top">
      <span class="iot-icon">🔊</span>
      <div class="iot-toggle"></div>
    </div>
    <div class="iot-name">小米音箱</div>
    <div class="iot-detail">客厅</div>
  </div>
</div>

</body>
</html>
