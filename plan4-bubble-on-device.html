.bub{position:absolute;top:-12px;left:50%;transform:translateX(-50%);padding:5px 11px;border-radius:12px;font-size:11px;line-height:1.3;white-space:nowrap;z-index:10;cursor:pointer;opacity:0;pointer-events:auto}
.bub::after{content:'';position:absolute;bottom:-4px;left:50%;width:8px;height:8px;border-radius:1px;transform:translateX(-50%) rotate(45deg)}
.bub.g{background:rgba(0,230,118,0.18);border:1px solid rgba(0,230,118,0.25);color:rgba(200,255,220,0.95)}
.bub.g::after{background:rgba(0,230,118,0.18)}
.bub.y{background:rgba(255,215,64,0.15);border:1px solid rgba(255,215,64,0.22);color:rgba(255,240,200,0.95)}
.bub.y::after{background:rgba(255,215,64,0.15)}

@keyframes bPop{0%{opacity:0;transform:translateX(-50%) scale(0.3) translateY(8px)}60%{opacity:1;transform:translateX(-50%) scale(1.06) translateY(-2px)}100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}
@keyframes bFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
.bub.a1{animation:bPop .4s ease-out .2s forwards, bFloat 3s ease-in-out 1s infinite}
.bub.a2{animation:bPop .4s ease-out .6s forwards, bFloat 3.2s ease-in-out 1.4s infinite}
.bub.a3{animation:bPop .4s ease-out 1s forwards, bFloat 2.8s ease-in-out 1.8s infinite}
