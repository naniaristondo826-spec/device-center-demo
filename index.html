<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Center Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #050a15; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

  .lock-screen {
    text-align: center; padding: 40px 30px;
    background: rgba(255,255,255,0.05); border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    width: 320px;
  }
  .lock-icon { font-size: 48px; margin-bottom: 16px; }
  .lock-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 8px; }
  .lock-subtitle { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 24px; }
  .lock-input {
    width: 100%; padding: 12px 16px; border: 1.5px solid rgba(255,255,255,0.12); border-radius: 10px;
    font-size: 16px; outline: none; text-align: center; letter-spacing: 4px;
    background: rgba(255,255,255,0.06); color: #fff;
    transition: border-color 0.2s;
  }
  .lock-input:focus { border-color: rgba(0,122,255,0.5); }
  .lock-input.error { border-color: #ff3b30; animation: shake 0.4s; }
  .lock-btn {
    width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 10px;
    background: rgba(0,122,255,0.8); color: #fff; font-size: 16px; font-weight: 500;
    cursor: pointer; transition: background 0.2s;
  }
  .lock-btn:hover { background: rgba(0,122,255,1); }
  .error-msg { color: #ff3b30; font-size: 13px; margin-top: 10px; min-height: 18px; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* 双方案展示 */
  .demo-view {
    display: none;
    width: 100vw; height: 100vh;
    flex-direction: column;
  }
  .demo-header {
    flex-shrink: 0; padding: 16px 24px;
    display: flex; align-items: center; justify-content: center; gap: 32px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .demo-label {
    font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7);
    padding: 6px 16px; border-radius: 8px;
    background: rgba(255,255,255,0.05);
  }
  .demo-frames {
    flex: 1; display: flex; gap: 0;
  }
  .demo-frames iframe {
    flex: 1; border: none; height: 100%;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .demo-frames iframe:last-child { border-right: none; }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">Demo 访问验证</div>
  <div class="lock-subtitle">请输入访问密码</div>
  <input class="lock-input" id="pwdInput" type="password" placeholder="••••" maxlength="20" autofocus>
  <button class="lock-btn" id="unlockBtn">进入</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="demo-view" id="demoView">
  <div class="demo-header">
    <span class="demo-label">方案1 - Bubble Chat</span>
    <span class="demo-label">方案2 - Badge Entry</span>
  </div>
  <div class="demo-frames">
    <iframe src="plan1-bubble-chat.html" id="frame1"></iframe>
    <iframe src="plan2-badge-entry.html" id="frame2"></iframe>
  </div>
</div>

<script>
  const PASSWORD = 'miclaw';

  function unlock() {
    const input = document.getElementById('pwdInput');
    const err = document.getElementById('errorMsg');
    if (input.value === PASSWORD) {
      sessionStorage.setItem('demo_unlocked', '1');
      showDemo();
    } else {
      input.classList.add('error');
      err.textContent = '密码错误，请重试';
      setTimeout(() => input.classList.remove('error'), 400);
    }
  }

  function showDemo() {
    document.getElementById('lockScreen').style.display = 'none';
    const view = document.getElementById('demoView');
    view.style.display = 'flex';
  }

  if (sessionStorage.getItem('demo_unlocked') === '1') showDemo();

  document.getElementById('unlockBtn').addEventListener('click', unlock);
  document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
</script>
</body>
</html>
