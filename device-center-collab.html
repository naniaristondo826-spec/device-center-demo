<style>

.nav{flex-shrink:0;padding:10px 0 8px;display:flex;justify-content:center;gap:6px}
.nav button{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid rgba(255,255,255,0.1);background:transparent;color:rgba(255,255,255,0.4);cursor:pointer}

.nav span{color:rgba(255,255,255,0.15);font-size:11px;line-height:30px}
.phone{width:390px;height:700px;border-radius:32px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);box-shadow:0 0 40px rgba(0,0,0,0.4);flex-shrink:0;position:relative;background:#080e1e}
.phone>iframe{width:100%;height:100%;border:none;display:none}
.phone>iframe.on{display:block}
</style>
</head>
<body>
<div class="nav">
  <button class="on" onclick="go(0)">① 小爱对话</button><span>→</span>
  <button onclick="go(1)">② 融合设备中心</button><span>→</span>
  <button onclick="go(2)">③ 群聊详情</button>
</div>
<div class="phone">
  <iframe class="on" srcdoc="" id="f0"></iframe>
  <iframe srcdoc="" id="f1"></iframe>
  <iframe srcdoc="" id="f2"></iframe>
</div>
<script>
function go(n){
  document.querySelectorAll('.phone>iframe').forEach((f,i)=>f.classList.toggle('on',i===n));
  document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));
}
