<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案五：小爱协作卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC',sans-serif;background:#050a15;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.label{padding:14px 0 8px;font-size:13px;color:rgba(255,255,255,0.5);font-weight:500;text-align:center;line-height:1.4}
.phone{width:390px;height:720px;border-radius:32px;overflow:hidden;border:2px solid rgba(255,255,255,0.08);box-shadow:0 0 40px rgba(0,0,0,0.4);background:#080e1e;position:relative}
.page{width:100%;height:100%;position:absolute;top:0;left:0;display:none}
.page.on{display:block}

/* ===== 小爱背景 ===== */
.xai-bg{position:absolute;inset:0;background:linear-gradient(180deg,#1a2a3a,#2a3848 30%,#4a6070 60%,#7a9aaa);z-index:0}
.xai-bg::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,0.25))}
.xai-bar{position:relative;z-index:2;display:flex;justify-content:space-between;padding:14px 24px 0;font-size:14px;font-weight:600;color:rgba(255,255,255,0.7)}

/* ===== 对话区 ===== */
.xai-chat{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg-row.right{justify-content:flex-end}
.msg-pill{padding:10px 16px;border-radius:20px;font-size:13px;line-height:1.5;max-width:280px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.msg-pill.user{background:rgba(0,100,255,0.7);color:#fff;border-radius:20px 20px 6px 20px}
.msg-pill.ai{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.95);border-radius:20px 20px 20px 6px;border:1px solid rgba(255,255,255,0.1)}
.xai-input{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:26px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(24px)}
.xai-input span.ph{flex:1;font-size:13px;color:rgba(255,255,255,0.5)}

/* ===== 协作卡片（毛玻璃浮层） ===== */
.collab-overlay{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px}
.collab-overlay.on{display:flex}
.collab-overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.collab-card{position:relative;z-index:1;width:100%;max-width:350px;border-radius:24px;background:linear-gradient(160deg,rgba(30,60,90,0.85),rgba(20,40,65,0.9));border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:24px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}

/* 卡片头部 */
.cc-header{margin-bottom:20px}
.cc-task{font-size:15px;font-weight:600;color:rgba(255,255,255,0.9);margin-bottom:6px}
.cc-cmd{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5;margin-bottom:12px}
.cc-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cc-step{padding:4px 10px;border-radius:10px;font-size:11px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.5)}
.cc-step.active{background:rgba(0,122,255,0.12);border-color:rgba(0,122,255,0.2);color:rgba(130,190,255,0.9)}
.cc-step.done{background:rgba(0,230,118,0.08);border-color:rgba(0,230,118,0.15);color:rgba(180,255,210,0.9)}
.cc-arrow{font-size:10px;color:rgba(255,255,255,0.15)}

/* 分割线 */
.cc-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);margin:16px 0}

/* 设备小卡网格 */
.cc-devices{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dev-mini{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 6px 12px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);overflow:visible}
.dev-mini.done{border-color:rgba(0,230,118,0.15);background:rgba(0,230,118,0.04)}
.dev-mini.wip{border-color:rgba(255,215,64,0.15);background:rgba(255,215,64,0.04)}
.dev-mini .d-icon{font-size:24px;margin-bottom:6px}
.dev-mini .d-name{font-size:10px;color:rgba(255,255,255,0.5);text-align:center;line-height:1.3}
.dev-mini .d-status{font-size:9px;margin-top:4px;color:rgba(255,255,255,0.3)}
.dev-mini .d-status.s-done{color:rgba(0,230,118,0.7)}
.dev-mini .d-status.s-wip{color:rgba(255,215,64,0.7)}

/* 设备气泡 */
.d-bub{position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:4px 8px;border-radius:8px;font-size:10px;line-height:1.2;white-space:nowrap;z-index:5;opacity:0}
.d-bub::after{content:'';position:absolute;bottom:-3px;left:50%;width:6px;height:6px;border-radius:1px;transform:translateX(-50%) rotate(45deg)}
.d-bub.bg{background:rgba(0,230,118,0.18);border:1px solid rgba(0,230,118,0.25);color:rgba(200,255,220,0.95)}
.d-bub.bg::after{background:rgba(0,230,118,0.18)}
.d-bub.by{background:rgba(255,215,64,0.15);border:1px solid rgba(255,215,64,0.22);color:rgba(255,240,200,0.95)}
.d-bub.by::after{background:rgba(255,215,64,0.15)}

@keyframes dbPop{0%{opacity:0;transform:translateX(-50%) scale(0.3) translateY(6px)}60%{opacity:1;transform:translateX(-50%) scale(1.05) translateY(-1px)}100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}
@keyframes dbFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2px)}}
.d-bub.ba1{animation:dbPop .4s ease-out .3s forwards, dbFloat 3s ease-in-out 1s infinite}
.d-bub.ba2{animation:dbPop .4s ease-out .7s forwards, dbFloat 3.2s ease-in-out 1.4s infinite}
.d-bub.ba3{animation:dbPop .4s ease-out 1.1s forwards, dbFloat 2.8s ease-in-out 1.8s infinite}

/* 底部关闭 */
.cc-close{text-align:center;margin-top:16px}
.cc-close span{font-size:12px;color:rgba(255,255,255,0.3);cursor:pointer;padding:6px 16px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06)}
</style>
</head>
<body>
<div class="label">方案五：小爱对话中弹出协作卡片</div>
<div class="phone">

  <!-- 小爱对话底层 -->
  <div class="page on" id="base">
    <div class="xai-bg"></div>
    <div class="xai-bar"><span>2:36</span><span>📶 🔋 100%</span></div>
    <div class="xai-chat">
      <div style="display:flex;flex-direction:column;gap:8px;padding:0 4px">
        <div class="msg-row right"><div class="msg-pill user">今晚朋友来家里吃饭，帮我准备一下氛围</div></div>
        <div class="msg-row"><div class="msg-pill ai">好的，安排客厅的灯、音箱和空调配合一下</div></div>
        <div class="msg-row"><div style="padding:10px 16px;border-radius:18px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.15);max-width:300px;backdrop-filter:blur(20px)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:600">聚会氛围准备</span><span style="font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,215,64,0.15);color:rgba(255,215,64,0.9);font-weight:500">进行中</span></div>
          <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:8px">3 台设备协作</div>
          <div style="display:flex;justify-content:flex-end"><span style="font-size:11px;color:rgba(130,200,255,0.9);cursor:pointer" onclick="showCard()">查看协作详情 →</span></div>
        </div></div>
      </div>
      <div class="xai-input"><span style="font-size:20px;opacity:.6">🎤</span><span class="ph">我在听...</span><span style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(255,255,255,0.5)">＋</span></div>
    </div>
  </div>

  <!-- 协作卡片浮层 -->
  <div class="collab-overlay" id="overlay">
    <div class="collab-overlay-bg" onclick="hideCard()"></div>
    <div class="collab-card">
      <div class="cc-header">
        <div class="cc-task">聚会氛围准备</div>
        <div class="cc-cmd">"今晚朋友来家里吃饭，帮我准备一下氛围"</div>
      </div>

      <div class="cc-divider"></div>

      <div class="cc-devices">
        <div class="dev-mini done">
          <div class="d-bub bg ba1">搞定啦～暖暖的</div>
          <div class="d-icon">💡</div>
          <div class="d-name">床头灯</div>
        </div>
        <div class="dev-mini wip">
          <div class="d-bub by ba2">翻歌单呢…</div>
          <div class="d-icon">🔊</div>
          <div class="d-name">Sound Pro</div>
        </div>
        <div class="dev-mini wip">
          <div class="d-bub by ba3">调温度中…</div>
          <div class="d-icon">❄️</div>
          <div class="d-name">空调</div>
        </div>
      </div>

    </div>
  </div>

</div>

<script>
function showCard(){
  document.getElementById('overlay').classList.add('on');
}
function hideCard(){
  document.getElementById('overlay').classList.remove('on');
}
</script>
</body>
</html>
